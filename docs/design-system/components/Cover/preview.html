      body {
        margin: 0;
        padding: 0;
        background: var(--surface-0);
      }
      .cv {
        position: relative;
        width: 960px;
        height: 288px;
        overflow: hidden;
        background: var(--surface-0);
      }
      .cv svg {
        position: absolute;
        inset: 0;
      }
      .vpbg {
        fill: var(--vp-bg);
      }
      .acc {
        fill: var(--accent);
      }
      .sel {
        fill: var(--select);
      }
      .ent {
        fill: var(--vp-entity);
      }
      .sat {
        rx: var(--radius-md);
      }
      .pl {
        stroke: var(--vp-grid-major);
        stroke-width: 1.5;
        fill: none;
      }
      .txt {
        position: absolute;
        left: 48px;
        bottom: 40px;
        max-width: 440px;
      }
      .nm {
        font: 600 80px/0.95 var(--font-ui);
        color: var(--ink);
        letter-spacing: -0.02em;
        margin: 0;
      }
      .tg {
        font: 400 14px/20px var(--font-ui);
        color: var(--ink-muted);
        margin: 16px 0 0;
      }
    </style>
  </head>
