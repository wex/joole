          return seed / 2147483647;
        }
        for (var y = 0; y < 16; y++)
          for (var x = 0; x < 16; x++) {
            var k = 0.7 + r() * 0.5;
            g.fillStyle =
              'rgb(' + ((c[0] * k) | 0) + ',' + ((c[1] * k) | 0) + ',' + ((c[2] * k) | 0) + ')';
            g.fillRect(x, y, 1, 1);
          }
      });
