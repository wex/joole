<head><meta charset="utf-8"><title>preview</title></head>

13L8 3l5 10z"/><rect x="6.5" y="1.5" width="3" height="3"/></svg></button><button class="q2-btn is-icon" aria-pressed="false" aria-label="Texture (T)" title="Texture (T)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11"/><path d="M2.5 8h11M8 2.5v11"/></svg></button><span class="q2-sep"></span><button class="q2-btn is-icon" aria-label="CSG Subtract" title="CSG Subtract"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="8" height="8"/><rect x="6" y="6" width="8" height="8" stroke-dasharray="2 1.5"/></svg></button><button class="q2-btn is-icon" aria-label="Hollow" title="Hollow"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12"/><rect x="5" y="5" width="6" height="6"/></svg></button><span class="q2-sep"></span><label class="q2-snap">Grid <input id="snap" type="range" min="0" max="8" value="3"><output id="snapv">8 units</output></label><button class="q2-btn" aria-pressed="true" id="texlock"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="7"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>Tex Lock</button><span class="q2-sep"></span><button class="q2-btn is-primary"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l8 5-8 5z"/></svg>Compile</button></div>
<script>var s=document.getElementById('snap'),o=document.getElementById('snapv');s.oninput=function(){o.textContent=(1<<s.value)+' units'};var t=document.getElementById('texlock');t.onclick=function(){t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')==='true'?'false':'true')};document.querySelectorAll('[aria-pressed][aria-label]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[aria-pressed][aria-label]').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true')}})</script>
</body>
</html>
