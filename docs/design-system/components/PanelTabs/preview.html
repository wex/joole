<!-- @dsCard group="Controls" height=56 width=720 subtitle="Panel switcher and view maximize" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>preview</title>
  </head>
  <body>
    <div class="q2-tabs" role="tablist">
      <button class="q2-tab" role="tab" aria-selected="false">Entity</button
      ><button class="q2-tab" role="tab" aria-selected="false">Surface</button
      ><button class="q2-tab" role="tab" aria-selected="true">Textures</button
      ><button class="q2-tab" role="tab" aria-selected="false">Prefabs</button
      ><button class="q2-tab" role="tab" aria-selected="false">Log</button
      ><span style="flex: 1"></span
      ><button class="q2-tab" role="tab" aria-selected="false">
        3D<span class="q2-kbd">F1</span></button
      ><button class="q2-tab" role="tab" aria-selected="false">
        Top<span class="q2-kbd">F2</span></button
      ><button class="q2-tab" role="tab" aria-selected="false">
        Front<span class="q2-kbd">F3</span></button
      ><button class="q2-tab" role="tab" aria-selected="false">
        Side<span class="q2-kbd">F4</span>
      </button>
    </div>
    <script>
      document.querySelectorAll('.q2-tab').forEach(function (b) {
        b.onclick = function () {
          b.parentNode.querySelectorAll('.q2-tab').forEach(function (x) {
            x.setAttribute('aria-selected', 'false');
          });
          b.setAttribute('aria-selected', 'true');
        };
      });
    </script>
  </body>
</html>
